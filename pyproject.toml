[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "softeval"
version = "0.1.0"
description = "Score model predictions against the distribution of several annotators' labels instead of one majority label."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["evaluation", "annotator disagreement", "soft labels", "label distribution", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "scipy>=1.10"]

[project.scripts]
softeval = "softeval.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/softeval"

[tool.hatch.build.targets.wheel]
packages = ["src/softeval"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["softeval"]
branch = true

[tool.coverage.report]
show_missing = true
